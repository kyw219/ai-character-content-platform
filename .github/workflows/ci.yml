name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: worker
      - name: Reject common secret formats
        run: |
          if git grep -En '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----)'; then
            echo 'Potential secret found'
            exit 1
          fi
